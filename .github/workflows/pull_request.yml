name: Pull Request

on:
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: "-Dorg.gradle.jvmargs='-Xmx4096m -XX:+UseParallelGC' -Dorg.gradle.parallel=true -Dorg.gradle.caching=true"

jobs:
  code-quality:
    name: Code Quality & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'zulu'
          
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        
      - name: Create local.properties
        run: |
          cp "${GITHUB_WORKSPACE}/local.properties.example" "${GITHUB_WORKSPACE}/local.properties"
          chmod u+x "${GITHUB_WORKSPACE}/local.properties"
          
      - name: Create google-services.json
        env:
          GOOGLE_SERVICES: ${{ secrets.GOOGLE_SERVICES }}
        run: echo $GOOGLE_SERVICES > app/google-services.json
        
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        
      - name: Run Code Style and Unit Tests
        env:
          TMDB_ACCESS_TOKEN: ${{ secrets.TMDB_ACCESS_TOKEN }}
        run: ./gradlew ktlintCheck detekt testDebugUnitTest --build-cache --continue
        
      - name: Upload Test Results
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: '**/build/reports/tests/'
          
      - name: Clean up temporary files
        if: ${{ always() }}
        run: |
          rm -f "${GITHUB_WORKSPACE}/local.properties"
          rm -f ./app/google-services.json

  android-lint:
    name: Android Lint Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'zulu'
          
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        
      - name: Create local.properties
        run: |
          cp "${GITHUB_WORKSPACE}/local.properties.example" "${GITHUB_WORKSPACE}/local.properties"
          chmod u+x "${GITHUB_WORKSPACE}/local.properties"
          
      - name: Create google-services.json
        env:
          GOOGLE_SERVICES: ${{ secrets.GOOGLE_SERVICES }}
        run: echo $GOOGLE_SERVICES > app/google-services.json
        
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        
      - name: Run Android Lint
        env:
          TMDB_ACCESS_TOKEN: ${{ secrets.TMDB_ACCESS_TOKEN }}
        run: ./gradlew lintDebug --build-cache --continue
        
      - name: Clean up temporary files
        if: ${{ always() }}
        run: |
          rm -f "${GITHUB_WORKSPACE}/local.properties"
          rm -f ./app/google-services.json

  build-validation:
    name: Build Compilation & Release Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'zulu'
          
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        
      - name: Create local.properties
        run: |
          cp "${GITHUB_WORKSPACE}/local.properties.example" "${GITHUB_WORKSPACE}/local.properties"
          chmod u+x "${GITHUB_WORKSPACE}/local.properties"
          
      - name: Create google-services.json
        env:
          GOOGLE_SERVICES: ${{ secrets.GOOGLE_SERVICES }}
        run: echo $GOOGLE_SERVICES > app/google-services.json
        
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        
      - name: Build Debug and Release
        env:
          TMDB_ACCESS_TOKEN: ${{ secrets.TMDB_ACCESS_TOKEN }}
        run: ./gradlew assembleDebug assembleRelease --build-cache --continue
        
      - name: Upload generated APK
        uses: actions/upload-artifact@v4
        with:
          name: upnext-debug
          path: app/build/outputs/apk/debug/**.apk
          
      - name: Clean up temporary files
        if: ${{ always() }}
        run: |
          rm -f "${GITHUB_WORKSPACE}/local.properties"
          rm -f ./app/google-services.json

  ui-tests:
    name: UI Tests (Instrumented)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'zulu'
          
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        
      - name: Create local.properties
        run: |
          cp "${GITHUB_WORKSPACE}/local.properties.example" "${GITHUB_WORKSPACE}/local.properties"
          chmod u+x "${GITHUB_WORKSPACE}/local.properties"
          
      - name: Create google-services.json
        env:
          GOOGLE_SERVICES: ${{ secrets.GOOGLE_SERVICES }}
        run: echo $GOOGLE_SERVICES > app/google-services.json
        
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          
      - name: Run Instrumented & Performance Tests
        uses: reactivecircus/android-emulator-runner@v2
        env:
          TMDB_ACCESS_TOKEN: ${{ secrets.TMDB_ACCESS_TOKEN }}
        with:
          api-level: 30
          arch: x86_64
          profile: pixel_6
          target: google_apis
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            ./gradlew :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.notClass=com.theupnextapp.screengrab.ScreenshotGenerationTest
            ./gradlew :baselineprofile:connectedNonMinifiedReleaseAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.theupnextapp.baselineprofile.StartupBenchmarks
          
      - name: Upload Test Results
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-and-performance-test-report
          path: |
            **/build/reports/androidTests/
            **/build/outputs/connected_android_test_additional_output/
          
      - name: Clean up temporary files
        if: ${{ always() }}
        run: |
          rm -f "${GITHUB_WORKSPACE}/local.properties"
          rm -f ./app/google-services.json
