appId: com.theupnextapp
---
# 1. Launch in clean guest state
- launchApp:
    clearState: true

# 2. Skip onboarding if visible
- runFlow:
    when:
      visible: "Skip"
    commands:
      - tapOn: "Skip"

- runFlow:
    when:
      visible: "Continue as Guest"
    commands:
      - tapOn: "Continue as Guest"

# 3. Verify Guest Dashboard elements
- assertVisible: "Tonight on TV"
- assertVisible: "Connect Trakt"

# 4. Navigate to Explore and test tabs
- tapOn: "Explore"
- assertVisible: "TRENDING"
- tapOn: "POPULAR"
- tapOn: "ANTICIPATED"

# 5. Open Show Detail
- tapOn:
    id: "explore_bento_card"
    index: 0
- assertVisible: "Seasons"
- back

# 6. Navigate to Search
- tapOn: "Search"
- tapOn: "Search for TV shows..."
- inputText: "Breaking Bad"
- pressKey: Enter
