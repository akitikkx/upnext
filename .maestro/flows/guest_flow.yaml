appId: com.theupnextapp
---
# 1. Launch in clean guest state
- launchApp:
    clearState: true

# 2. Skip onboarding if visible
- runFlow:
    when:
      visible: "Skip"
    commands:
      - tapOn: "Skip"

- runFlow:
    when:
      visible: "Continue as Guest"
    commands:
      - tapOn: "Continue as Guest"

# 3. Verify Guest Dashboard elements
- assertVisible: "Tonight on TV"
- assertVisible: "Connect Trakt"

# 4. Navigate to Explore and test tabs
- tapOn: "Explore"
- assertVisible: "TRENDING"
- tapOn: "POPULAR"
- tapOn: "ANTICIPATED"
- tapOn: "TRENDING"

# 5. Open Show Detail
- runFlow:
    when:
      visible: "Retry"
    commands:
      - tapOn: "Retry"

- extendedWaitUntil:
    visible:
      id: "explore_hero_card"
    timeout: 45000
- tapOn:
    id: "explore_hero_card"
- extendedWaitUntil:
    visible: "GENRES"
    timeout: 30000
- back

# 6. Navigate to Search
- tapOn: "Search"
- tapOn:
    id: "search_input"
- inputText: "Breaking Bad"
- pressKey: Enter
- extendedWaitUntil:
    visible: "Breaking Bad"
    timeout: 30000

